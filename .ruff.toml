# Expand this list when a module has been reviewed and formatted.
required-version = '==0.14.3'
target-version = 'py310'
line-length = 88
include = [
    'src/pixelart/cli.py',
    'tests/test_chunk_trial.py',
    'tests/fixtures/chunk_trial/*.py',
    'tools/check.py',
    'tools/check_format.py',
]
force-exclude = true

[lint]
select = ['E401', 'E701', 'E702', 'E703']

[format]
quote-style = 'single'
indent-style = 'space'
line-ending = 'lf'
